<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SOP PT BAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-blue-900 mb-4">Portal SOP PT BAS</h1>
        
        <!-- Kotak Pencarian Sederhana -->
        <input type="text" id="searchInput" placeholder="Cari judul SOP..." onkeyup="filterSOP()"
               class="w-full p-3 border-2 border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-4">
        
        <!-- Daftar Dokumen SOP -->
        <ul id="sopList" class="space-y-3">
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_Fatigue_Management_012.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Fatigue Management 012</a>
            </li>
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_Identifikasi_Bahaya_dan_Penilaian Resiko_003.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Identifikasi Bahaya dan Penilaian Resiko 003</a>
            </li>
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_induksi_001.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Induksi 001</a>
            </li>
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_inspeksi_keselamatan_020.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Inspeksi Keselamatan 020</a>
            </li>
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_Job_Safety_Analysis_006.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Job Safety Analysis 006</a>
            </li>
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_Mining_Service_005.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Mining Service 005</a>
            </li>
            <li class="bg-white p-4 rounded-lg shadow border border-gray-100">
                <a href="dokumen_sop/sop_Pelaporan_Bahaya_002.pdf" target="_blank" class="font-bold text-blue-700 hover:underline block">SOP Pelaporan Bahaya 002</a>
            </li>
        </ul>
    </div>

    <script>
        function filterSOP() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let ul = document.getElementById('sopList');
            let li = ul.getElementsByTagName('li');

            for (let i = 0; i < li.length; i++) {
                let a = li[i].getElementsByTagName('a')[0];
                let textValue = a.textContent || a.innerText;
                if (textValue.toLowerCase().indexOf(input) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
