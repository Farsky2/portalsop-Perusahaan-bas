<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SOP PT BAS - MiniSearch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat MiniSearch Library secara langsung dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.min.js"></script>
    <style>
        mark { background-color: #fde047; padding: 0 2px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-blue-900 mb-4">Portal SOP PT BAS (Smart Search)</h1>
        
        <!-- Kotak Pencarian Ala Meilisearch -->
        <input type="text" id="searchInput" placeholder="Cari keyword bebas (Contoh: penyebab fatigue, jalan, apd)..." 
               class="w-full p-3 border-2 border-blue-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-4 shadow-sm">
        
        <!-- Area Hasil Pencarian -->
        <div id="resultsList" class="space-y-3"></div>
    </div>

    <script>
        // 1. Data Dokumen SOP lengkap dengan isi teks/keterangannya
        const documents = [
            {
                id: '1',
                judul: 'SOP Fatigue Management 012',
                file: 'dokumen_sop/sop_Fatigue_Management_012.pdf',
                halaman: '3',
                kategori: 'Pengelolaan Kelelahan Kerja & Shift',
                teks: 'Panduan lengkap penyebab kelelahan, faktor pemicu fatigue, aturan jam kerja, shift, waktu istirahat, dan pencegahan kondisi fisik pengawasan driver operator tambang.'
            },
            {
                id: '2',
                judul: 'SOP Identifikasi Bahaya dan Penilaian Resiko 003',
                file: 'dokumen_sop/sop_Identifikasi_Bahaya_dan_Penilaian Resiko_003.pdf',
                halaman: '2',
                kategori: 'Penilaian Resiko K3 & Safety',
                teks: 'Panduan mengenali potensi bahaya, alat pelindung diri apd, mitigasi kecelakaan kerja, dan tingkat resiko di lingkungan kerja lapangan.'
            },
            {
                id: '3',
                judul: 'SOP Induksi 001',
                file: 'dokumen_sop/sop_induksi_001.pdf',
                halaman: '1',
                kategori: 'Induksi Karyawan Baru & Tamu',
                teks: 'Tata cara pengenalan awal keselamatan kerja, kumpul karyawan baru, safety induction, tamu, dan pengenalan area kerja site tambang aturan umum.'
            },
            {
                id: '4',
                judul: 'SOP Inspeksi Keselamatan 020',
                file: 'dokumen_sop/sop_inspeksi_keselamatan_020.pdf',
                halaman: '4',
                kategori: 'Inspeksi Lapangan & Kelayakan Alat',
                teks: 'Pemeriksaan berkala kondisi area kerja, jalan tambang, hauling, cek unit alat, kelayakan, dan periksa mesin operasional.'
            },
            {
                id: '5',
                judul: 'SOP Job Safety Analysis 006',
                file: 'dokumen_sop/sop_Job_Safety_Analysis_006.pdf',
                halaman: '2',
                kategori: 'Analisis Keselamatan Kerja (JSA)',
                teks: 'Memetakan langkah kerja aman, jsa, mitigasi bahaya spesifik, dan analisis prosedur tugas pekerjaan.'
            },
            {
                id: '6',
                judul: 'SOP Mining Service 005',
                file: 'dokumen_sop/sop_Mining_Service_005.pdf',
                halaman: '17',
                kategori: 'Layanan Penambangan & Sump/Lumpur',
                teks: 'Panduan layanan penambangan, pengelolaan sump, lumpur, disposal tambang, pemompaan air, material over burden, jalan hauling pit.'
            },
            {
                id: '7',
                judul: 'SOP Pelaporan Bahaya 002',
                file: 'dokumen_sop/sop_Pelaporan_Bahaya_002.pdf',
                halaman: '2',
                kategori: 'Pelaporan Insiden & Near Miss',
                teks: 'Mekanisme pelaporan temuan bahaya, insiden, near miss, kejadian hampir celaka, dan form pelaporan.'
            }
        ];

        // 2. Inisialisasi MiniSearch (Mesin pencarian mirip Meilisearch di dalam browser)
        let miniSearch = new MiniSearch({
            fields: ['judul', 'kategori', 'teks'], // Field yang akan dicari
            storeFields: ['judul', 'file', 'halaman', 'kategori', 'teks']
        });

        // Masukkan data dokumen ke mesin pencari
        miniSearch.addAll(documents);

        const input = document.getElementById('searchInput');
        const list = document.getElementById('resultsList');

        // Fungsi untuk menampilkan semua dokumen secara default saat halaman dibuka
        function displayAll() {
            list.innerHTML = '';
            documents.forEach(doc => {
                renderCard(doc, '');
            });
        }

        function renderCard(doc, query) {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-lg shadow border border-gray-100 transition hover:shadow-md";
            
            // Highlight teks sederhana jika ada query pencarian
            let highlightedText = doc.teks;
            if (query) {
                const regex = new RegExp(`(${query})`, 'gi');
                highlightedText = doc.teks.replace(regex, '<mark>$1</mark>');
            }

            card.innerHTML = `
                <a href="${doc.file}#page=${doc.halaman}" target="_blank" class="font-bold text-blue-700 hover:underline block text-lg">${doc.judul}</a>
                <p class="text-sm bg-yellow-100 text-yellow-800 inline-block px-2 py-0.5 rounded mt-1 font-semibold">📍 Langsung ke Halaman ${doc.halaman} (${doc.kategori})</p>
                <p class="text-sm text-gray-600 mt-1">${highlightedText}</p>
            `;
            list.appendChild(card);
        }

        // Tampilkan semua data di awal
        displayAll();

        // 3. Event Listener saat mengetik di kotak pencarian (Pencarian Real-time Canggih)
        input.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            list.innerHTML = '';

            if (query === '') {
                displayAll();
                return;
            }

            // Cari menggunakan MiniSearch dengan toleransi typo (fuzzy search)
            const results = miniSearch.search(query, { 
                fuzzy: 0.2, // Memberikan toleransi salah ketik sedikit
                prefix: true // Pencarian awalan kata
            });

            if (results.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-4">Tidak ada SOP yang cocok dengan kata kunci "<b>${query}</b>"</p>`;
                return;
            }

            results.forEach(result => {
                renderCard(result, query);
            });
        });
    </script>
</body>
</html>
