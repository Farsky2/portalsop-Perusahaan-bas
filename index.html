<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SOP PT BAS - Full PDF Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        mark { background-color: #fde047; padding: 0 2px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">Portal SOP PT BAS</h1>
        <p id="statusMsg" class="text-xs text-gray-500 mb-4">⏳ Memuat dan membaca isi dokumen PDF...</p>
        
        <!-- Kotak Pencarian -->
        <input type="text" id="searchInput" placeholder="Ketik kata apa saja (cth: lumpur, jalan, fatigue, apd)..." 
               class="w-full p-3 border-2 border-blue-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-4 shadow-sm" disabled>
        
        <!-- Hasil Pencarian -->
        <div id="resultsList" class="space-y-3"></div>
    </div>

    <script>
        const sopFiles = [
            { judul: 'SOP Fatigue Management 012', file: 'dokumen_sop/sop_Fatigue_Management_012.pdf' },
            { judul: 'SOP Identifikasi Bahaya dan Penilaian Resiko 003', file: 'dokumen_sop/sop_Identifikasi_Bahaya_dan_Penilaian Resiko_003.pdf' },
            { judul: 'SOP Induksi 001', file: 'dokumen_sop/sop_induksi_001.pdf' },
            { judul: 'SOP Inspeksi Keselamatan 020', file: 'dokumen_sop/sop_inspeksi_keselamatan_020.pdf' },
            { judul: 'SOP Job Safety Analysis 006', file: 'dokumen_sop/sop_Job_Safety_Analysis_006.pdf' },
            { judul: 'SOP Mining Service 005', file: 'dokumen_sop/sop_Mining_Service_005.pdf' },
            { judul: 'SOP Pelaporan Bahaya 002', file: 'dokumen_sop/sop_Pelaporan_Bahaya_002.pdf' }
        ];

        let parsedData = [];

        async function loadAndExtractPDFs() {
            for (let sop of sopFiles) {
                try {
                    const loadingTask = pdfjsLib.getDocument(sop.file);
                    const pdf = await loadingTask.promise;
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        let pageText = textContent.items.map(item => item.str).join(' ');
                        
                        parsedData.push({
                            judul: sop.judul,
                            file: sop.file,
                            halaman: i,
                            teks: pageText
                        });
                    }
                } catch (error) {
                    console.error("Gagal membaca file: " + sop.file, error);
                }
            }

            document.getElementById('statusMsg').innerText = "✅ Semua dokumen berhasil dibaca dan dianalisis!";
            document.getElementById('searchInput').removeAttribute('disabled');
            document.getElementById('searchInput').focus();
        }

        loadAndExtractPDFs();

        const input = document.getElementById('searchInput');
        const list = document.getElementById('resultsList');

        input.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            list.innerHTML = '';

            if (query === '') return;

            const matches = parsedData.filter(item => item.teks.toLowerCase().includes(query));

            if (matches.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-4">Tidak ditemukan kata "<b>${query}</b>" di dalam dokumen.</p>`;
                return;
            }

            matches.slice(0, 15).forEach(match => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow border border-gray-100 transition hover:shadow-md";
                
                // Ambil cuplikan teks di sekitar kata kunci (Snippet Extraction)
                const lowerTeks = match.teks.toLowerCase();
                const index = lowerTeks.indexOf(query);
                let start = Math.max(0, index - 80);
                let end = Math.min(match.teks.length, index + query.length + 120);
                let snippet = match.teks.substring(start, end);
                if (start > 0) snippet = "..." + snippet;
                if (end < match.teks.length) snippet = snippet + "...";

                // Berikan efek highlight kuning (<mark>) pada kata kunci
                const regex = new RegExp(`(${query})`, 'gi');
                const highlightedSnippet = snippet.replace(regex, '<mark>$1</mark>');

                card.innerHTML = `
                    <a href="${match.file}#page=${match.halaman}" target="_blank" class="font-bold text-blue-700 hover:underline block text-lg">${match.judul}</a>
                    <p class="text-sm bg-yellow-100 text-yellow-800 inline-block px-2 py-0.5 rounded mt-1 font-semibold">📍 Ditemukan di Halaman ${match.halaman}</p>
                    <p class="text-sm text-gray-700 mt-2 italic bg-gray-50 p-2 rounded border border-gray-100">"${highlightedSnippet}"</p>
                `;
                list.appendChild(card);
            });
        });
    </script>
</body>
</html>
