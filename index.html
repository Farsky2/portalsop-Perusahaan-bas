<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Agar highlight kuning Meilisearch muncul */
        mark { background-color: #fde047; padding: 0 2px; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-blue-900 mb-4">Portal SOP</h1>
        <input type="text" id="searchInput" placeholder="Cari prosedur (Contoh: lumpur)..." 
               class="w-full p-3 border-2 border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-4">
        
        <div id="resultsList" class="space-y-3"></div>
    </div>

    <script>
        // Ganti link ini dengan hasil dari "ssh -R 80:127.0.0.1:8000 nokey@localhost.run"
        const BASE_TUNNEL_URL = "https://YOUR_NEW_LINK.lhr.life";

        const input = document.getElementById('searchInput');
        const list = document.getElementById('resultsList');

        input.addEventListener('input', async (e) => {
            const q = e.target.value;
            if(q.length < 2) { list.innerHTML = ''; return; }

            try {
                const res = await fetch(`${BASE_TUNNEL_URL}/search?q=${q}`);
                const data = await res.json();
                list.innerHTML = '';

                data.hits.forEach(hit => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-lg shadow border border-gray-100 cursor-pointer";
                    card.innerHTML = `
                        <h3 class="font-bold text-blue-700">${hit.judul_dokumen}</h3>
                        <p class="text-sm bg-blue-50 text-blue-800 inline-block px-2 py-0.5 rounded mt-1">Halaman ${hit.nomor_halaman}</p>
                        <p class="text-sm text-gray-600 mt-2 italic">... ${hit._formatted.isi_teks} ...</p>
                    `;
                    card.onclick = () => window.open(`/${hit.file_path}#page=${hit.nomor_halaman}`, '_blank');
                    list.appendChild(card);
                });
            } catch (err) {
                list.innerHTML = `<p class="text-red-500 text-center">Server belum nyala, silakan cek terminal!</p>`;
            }
        });
    </script>
</body>
</html>
